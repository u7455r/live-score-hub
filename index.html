  <style>
    :root {
      --bg: #030712;
      --card: rgba(15, 23, 42, 0.7);
      --card-border: rgba(255, 255, 255, 0.09);
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.45);
      --cyan: #00f2fe;
      --cyan-glow: rgba(0, 242, 254, 0.35);
      --gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 0, 85, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.5) 0px, transparent 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* হায়ার লেভেল হেডার */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span {
      background: linear-gradient(135deg, #ff0055, #ff5e7e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: var(--cyan);
      letter-spacing: 0.5px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      animation: pulseAnim 1.4s infinite;
    }

    @keyframes pulseAnim {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    .tabs {
      display: flex;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 0.6rem;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), #d9044b);
      color: #fff;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* মূল কন্টেন্ট লেআউট */
    main {
      flex: 1;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 0.8rem;
    }

    .view-view {
      display: none;
      width: 100%;
    }

    .view-view.active {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* সিনেমাটিক প্লেয়ার এরিয়া */
    .player-deck {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .stream-meta {
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .meta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .meta-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meta-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .quick-actions {
      display: flex;
      gap: 0.5rem;
    }

    .action-btn {
      flex: 1;
      text-align: center;
      padding: 0.6rem;
      border-radius: 9px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* চ্যানেল কন্ট্রোল ও ক্যাটাগরি ফিল্টার */
    .controls-deck {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .search-bar {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar:focus {
      border-color: var(--cyan);
    }

    .categories-bar {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--muted);
      padding: 0.4rem 0.8rem;
      border-radius: 99px;
      font-size: 0.74rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .cat-pill.active {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* রিচ চ্যানেল গ্রিড */
    .channels-scroll {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .chan-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.65rem 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 0.75rem;
    }

    .chan-item:hover {
      background: rgba(255, 255, 255, 0.07);
      transform: translateY(-2px);
    }

    .chan-item.active {
      border-color: var(--accent);
      background: linear-gradient(90deg, rgba(255, 0, 85, 0.18), rgba(255, 0, 85, 0.05));
    }

    .chan-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .chan-logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .chan-text {
      min-width: 0;
      flex: 1;
    }

    .chan-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chan-genre {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .chan-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      flex-shrink: 0;
    }

    /* লাইভ সার্ভার কার্ডস */
    #serversTab {
      display: none;
      width: 100%;
      flex-direction: column;
      gap: 0.8rem;
    }

    #serversTab.active {
      display: flex;
    }

    .server-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .server-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .server-title {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
    }

    .server-tag {
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--gold);
      font-weight: 700;
    }

    .server-actions {
      display: flex;
      gap: 0.5rem;
    }

    .server-link {
      flex: 1;
      text-align: center;
      padding: 0.6rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--card-border);
    }

    .server-link.mirror {
      background: rgba(255, 0, 85, 0.12);
      border-color: rgba(255, 0, 85, 0.3);
      color: #ff5284;
    }

    /* আল্ট্রা গেট মডাল */
    #gateModal {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.96);
      backdrop-filter: blur(25px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }

    .gate-card {
      width: 100%;
      max-width: 390px;
      background: #090e1a;
      border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 20px;
      padding: 2rem 1.4rem;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }

    .gate-icon {
      font-size: 3.2rem;
      margin-bottom: 0.6rem;
    }

    .gate-card h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .gate-card p {
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 1.6rem;
    }

    .tg-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #229ED9;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      padding: 0.9rem;
      border-radius: 12px;
      margin-bottom: 0.8rem;
      font-size: 0.92rem;
      box-shadow: 0 8px 20px rgba(34, 158, 217, 0.3);
    }

    .unlock-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      font-weight: 700;
      padding: 0.85rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    @media (min-width: 960px) {
      header {
        flex-direction: row;
        justify-content: space-between;
        padding: 1rem 2.5rem;
      }
      .header-top { width: auto; gap: 2rem; }
      .tabs { width: 340px; }
      .view-view.active {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 1.5rem;
      }
      #serversTab.active {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      }
      .channels-scroll {
        max-height: calc(100vh - 220px);
      }
    }
  </style>
</head>

      { name: "Streamed (T Sports, beIN, Star Sports)", note: "লাইভ ফুটবল ও ক্রিকেট সার্ভার", url: "https://streamed.pk/", mirror: "https://strmd.link/" },

    ];

    let currentActiveIdx = 0;
    let selectedGenre = 'ALL';
    let hls = null;
    const player = document.getElementById('hlsPlayer');
    const channelDeck = document.getElementById('channelDeck');
    const serversTab = document.getElementById('serversTab');
    const playerTab = document.getElementById('playerTab');
    const channelHeading = document.getElementById('channelHeading');
    const channelMeta = document.getElementById('channelMeta');
    const vlcIntent = document.getElementById('vlcIntent');

    function renderDeck(items) {
      channelDeck.innerHTML = '';
      items.forEach(chan => {
        const trueIdx = channels.findIndex(c => c.url === chan.url);
        const card = document.createElement('div');
        card.className = `chan-item ${trueIdx === currentActiveIdx ? 'active' : ''}`;
        card.innerHTML = `
          <div class="chan-main">
            <img src="${chan.logo}" class="chan-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/53/53283.png'">
            <div class="chan-text">
              <div class="chan-name">${chan.name}</div>
              <div class="chan-genre">● ${chan.cat}</div>
            </div>
          </div>
          <div class="chan-badge">${chan.quality}</div>
        `;
        card.onclick = () => startStream(chan, trueIdx);
        channelDeck.appendChild(card);
      });
    }

    function selectCat(cat, elem) {
      selectedGenre = cat;
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      elem.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('filterInput').value.toLowerCase();
      const filtered = channels.filter(c => {
        const matchesCat = (selectedGenre === 'ALL' || c.cat === selectedGenre);
        const matchesQuery = c.name.toLowerCase().includes(q);
        return matchesCat && matchesQuery;
      });
      renderDeck(filtered);
    }

    function startStream(chan, idx) {
      currentActiveIdx = idx;
      channelHeading.innerText = chan.name;
      channelMeta.innerText = `${chan.cat} • ${chan.quality} • Fast CDN Stream`;
      vlcIntent.href = chan.url;

      applyFilters();

      if (hls) {
        hls.destroy();
      }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60
        });
        hls.loadSource(chan.url);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED, () => player.play().catch(() => {}));
        
        // অটো-রিকভারি যাতে ইউজার কখনো এরর পেজ না দেখে
        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                break;
            }
          }
        });
      } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
        player.src = chan.url;
        player.play().catch(() => {});
      }
    }

    function copyCurrentLink() {
      const link = channels[currentActiveIdx].url;
      navigator.clipboard.writeText(link).then(() => {
        alert('লাইভ স্ট্রিম লিংক কপি হয়েছে! VLC বা MX Player-এ পেস্ট করে দেখতে পারেন।');
      });
    }

    function switchNav(type, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (type === 'player') {
        playerTab.classList.add('active');
        serversTab.classList.remove('active');
      } else {
        playerTab.classList.remove('active');
        serversTab.classList.add('active');
      }
    }

    // সার্ভার হাব তৈরি
    hubs.forEach(h => {
      const el = document.createElement('div');
      el.className = 'server-card';
      let mirrorBtn = h.mirror ? `<a href="${h.mirror}" target="_blank" class="server-link mirror">বিকল্প মিরর</a>` : '';

        <div class="server-top">
          <div class="server-title">${h.name}</div>
          <span class="server-tag">ACTIVE 24/7</span>
        </div>
        <p style="font-size: 0.78rem; color: var(--muted);">${h.note}</p>
        <div class="server-actions">
          <a href="${h.url}" target="_blank" class="server-link">সার্ভারে প্রবেশ করুন</a>
          ${mirrorBtn}
        </div>
      `;
      serversTab.appendChild(el);
    });

    renderDeck(channels);
