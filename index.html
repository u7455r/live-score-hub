  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #05070d;
      --card-bg: rgba(13, 17, 28, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.5);
      --cyan: #00f2fe;
      --cyan-glow: rgba(0, 242, 254, 0.4);
      --telegram: #229ED9;
      --text: #f3f4f6;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 0, 85, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.08) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2.5rem;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 7, 13, 0.85);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand span {
      background: linear-gradient(135deg, #ff0055, #ff5e00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand .badge {
      font-size: 0.65rem;
      background: rgba(0, 242, 254, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(0, 242, 254, 0.4);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #ff0055, #ff3366);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    main {
      flex: 1;
      max-width: 1650px;
      margin: 0 auto;
      width: 100%;
      padding: 2rem;
    }

    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: grid;
    }

    /* Player View */
    #streamView {
      grid-template-columns: 1fr 390px;
      gap: 2rem;
    }

    .player-section {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .video-container {
      position: relative;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px -10px rgba(255, 0, 85, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .now-playing {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1.25rem 1.8rem;
      border-radius: 16px;
      backdrop-filter: blur(16px);
    }

    .title-area h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
    }

    .title-area p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    .player-stat {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .live-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #ff0055;
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 99px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: blink 1.2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Channels Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      height: calc(100vh - 160px);
      position: sticky;
      top: 105px;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1.2rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
      backdrop-filter: blur(12px);
    }

    .search-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 20px var(--cyan-glow);
    }

    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      overflow-y: auto;
      padding-right: 6px;
    }

    .channel-list::-webkit-scrollbar {
      width: 5px;
    }
    .channel-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    .channel-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1rem 1.2rem;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(8px);
    }

    .channel-card:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .channel-card.active {
      border-color: var(--accent);
      background: rgba(255, 0, 85, 0.1);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .channel-name {
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quality-tag {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Servers Grid */
    #serversView {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      width: 100%;
    }

    #serversView.active {
      display: grid;
    }

    .server-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.2rem;
      backdrop-filter: blur(16px);
      transition: all 0.3s;
    }

    .server-card:hover {
      border-color: var(--cyan);
      box-shadow: 0 10px 30px var(--cyan-glow);
      transform: translateY(-4px);
    }

    .server-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .server-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }

    .server-type {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      background: rgba(0, 242, 254, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(0, 242, 254, 0.3);
    }

    .server-actions {
      display: flex;
      gap: 0.6rem;
    }

    .server-btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--card-border);
      transition: all 0.25s;
    }

    .server-btn:hover {
      background: #fff;
      color: #000;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .server-btn.mirror {
      background: rgba(255, 0, 85, 0.1);
      border-color: rgba(255, 0, 85, 0.3);
      color: #ff4d82;
    }

    .server-btn.mirror:hover {
      background: var(--accent);
      color: #fff;
    }

    /* TELEGRAM VIP LOCK OVERLAY */
    #lockModal {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 13, 0.94);
      backdrop-filter: blur(25px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .lock-box {
      max-width: 480px;
      width: 100%;
      background: linear-gradient(180deg, rgba(20, 25, 40, 0.95), rgba(10, 14, 25, 0.95));
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 24px;
      padding: 2.5rem;
      text-align: center;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8), 0 0 50px rgba(0, 242, 254, 0.15);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .lock-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .lock-box h2 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .lock-box p {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .telegram-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--telegram);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      transition: all 0.3s;
      box-shadow: 0 6px 25px rgba(34, 158, 217, 0.4);
    }

    .telegram-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(34, 158, 217, 0.6);
    }

      width: 100%;
      background: transparent;
      border: 1px solid var(--card-border);
      color: #fff;
      font-weight: 700;
      padding: 0.9rem;
      border-radius: 12px;

      border-color: rgba(255, 255, 255, 0.3);

      .sidebar {

        position: static;

      .channel-list {

      main {

      header {

        flex-direction: column;
        gap: 1rem;

    const video = document.getElementById('videoPlayer');
    const channelGrid = document.getElementById('channelGrid');
    const serversView = document.getElementById('serversView');
    const streamView = document.getElementById('streamView');
    const currentChannel = document.getElementById('currentChannel');
    const streamInfo = document.getElementById('streamInfo');
    let hlsInstance = null;
    let selectedIndex = 0;

    function renderChannels(channelsToRender) {
      channelGrid.innerHTML = '';
      channelsToRender.forEach((channel) => {
        const originalIndex = streams.findIndex(s => s.url === channel.url);
        const card = document.createElement('div');
        card.className = `channel-card ${originalIndex === selectedIndex ? 'active' : ''}`;
        card.innerHTML = `
          <div class="channel-info">
            <span>⚡</span>
            <div class="channel-name" title="${channel.name}">${channel.name}</div>
          </div>
          <div class="quality-tag">${channel.quality}</div>
        `;
        card.onclick = () => playChannel(channel, originalIndex);
        channelGrid.appendChild(card);
      });
    }

    function filterChannels() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = streams.filter(c => c.name.toLowerCase().includes(query));
      renderChannels(filtered);
    }

    function playChannel(channel, index) {
      selectedIndex = index;
      currentChannel.innerText = channel.name;
      streamInfo.innerText = `Protocol: HLS/TS • Source: ${channel.url}`;

      const query = document.getElementById('searchInput').value.toLowerCase();
      if (query) {
        filterChannels();
      } else {
        renderChannels(streams);
      }

      if (hlsInstance) {
        hlsInstance.destroy();
      }

      if (Hls.isSupported() && channel.url.includes('.m3u8')) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(channel.url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else {
        video.src = channel.url;
        video.play().catch(() => {});
      }
    }

    function switchTab(tab, element) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      if (tab === 'stream') {
        streamView.classList.add('active');
        serversView.classList.remove('active');
      } else {
        streamView.classList.remove('active');
        serversView.classList.add('active');
      }
    }

    // Load Servers
    servers.forEach(server => {
      const card = document.createElement('div');
      card.className = 'server-card';
      let actionButtons = `<a href="${server.main}" target="_blank" rel="noopener noreferrer" class="server-btn">Server Link</a>`;
      if (server.mirror) {
        actionButtons += `<a href="${server.mirror}" target="_blank" rel="noopener noreferrer" class="server-btn mirror">Mirror Link</a>`;
      }
      card.innerHTML = `
        <div class="server-header">
          <div class="server-title">${server.name}</div>
          <span class="server-type">${server.type}</span>
        </div>
        <div class="server-actions">${actionButtons}</div>
      `;
      serversView.appendChild(card);
    });
