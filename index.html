<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRO SPORTS LIVE HUB | Global Match Scores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #08090d;
      --card-bg: rgba(18, 22, 31, 0.85);
      --accent-neon: #00f2fe;
      --accent-red: #ff3366;
      --accent-gold: #ffb703;
      --accent-tg: #0088cc;
      --border: rgba(255, 255, 255, 0.08);
      --font-display: 'Rajdhani', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 51, 102, 0.05) 0%, transparent 40%);
      color: #f1f5f9;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 14px 10px 40px;
    }

    .app-shell {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ১. সাইবারপাঙ্ক হেডার ও লাইভ টিক্স */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 51, 102, 0.12);
      border: 1px solid rgba(255, 51, 102, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-red);
      font-family: var(--font-display);
      letter-spacing: 0.5px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-red);
      border-radius: 50%;
      animation: neonPulse 1.4s infinite alternate;
    }

    @keyframes neonPulse {
      0% { opacity: 0.4; transform: scale(0.85); box-shadow: 0 0 0 rgba(255, 51, 102, 0); }
      100% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 10px var(--accent-red); }
    }

    /* ২. প্রফেশনাল স্ট্যাটাস ও ভিউয়ার অ্যানালিটিক্স */
    .metric-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14, 17, 23, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 12px;
    }

    .active-users {
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .active-users strong {
      color: #10b981;
      font-family: var(--font-display);
      font-size: 15px;
    }

    .utc-clock {
      color: #64748b;
      font-size: 11px;
      font-family: monospace;
    }

    /* ৩. অফিশিয়াল টেলিগ্রাম কার্ড */
    .tg-vip-card {
      background: linear-gradient(135deg, rgba(0, 136, 204, 0.15) 0%, rgba(20, 26, 36, 0.9) 100%);
      border: 1px solid rgba(0, 136, 204, 0.35);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .tg-text h4 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tg-text p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .tg-link-btn {
      background: var(--accent-tg);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
      transition: transform 0.15s ease;
    }

    .tg-link-btn:active {
      transform: scale(0.96);
    }

    /* ৪. আল্ট্রা-মডার্ন স্পোর্টস ক্যাটাগরি পিলস */
    .sports-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #0d1117;
      border: 1px solid var(--border);
      padding: 6px;
      border-radius: 14px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      padding: 10px 4px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.25s ease;
      font-family: var(--font-body);
    }

    .tab-btn span.icon {
      font-size: 16px;
    }

    .tab-btn.active {
      background: #1b2230;
      color: var(--accent-neon);
      border: 1px solid rgba(0, 242, 254, 0.25);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.15);
    }

    /* ৫. লাইভ স্কোরপোর্টাল ডিসপ্লে স্ক্রিন */
    .hub-monitor {
      width: 100%;
      height: 540px;
      background: #0b0d13;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .hub-monitor iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* লোডার বার */
    .monitor-loader {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, var(--accent-neon), var(--accent-red));
      animation: scanning 2s infinite ease-in-out;
    }

    @keyframes scanning {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ৬. কুইক অ্যাকশন কন্ট্রোলস */
    .controls-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 14px;
    }

    .refresh-pill {
      background: #161b26;
      border: 1px solid var(--border);
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-pill:active {
      background: #202737;
      color: #fff;
    }

    .share-btn {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="app-shell">

    <!-- হেডার -->
    <header class="top-header">
      <div class="brand-title">
        ⚡ PRO SPORTS
      </div>
      <div class="live-indicator">
        <div class="pulse-dot"></div> ACTIVE FEED
      </div>
    </header>

    <!-- রিয়েল-টাইম এনালিটিক্স ও মেকানিক্স -->
    <div class="metric-bar">
      <div class="active-users">
        <span>● Active Viewers:</span>
        <strong id="counterDisplay">1,482</strong>
      </div>
      <div class="utc-clock" id="liveClock">00:00:00 GMT</div>
    </div>

    <!-- ভিআইপি টেলিগ্রাম লিঙ্ক -->
    <div class="tg-vip-card">
      <div class="tg-text">
        <h4>Official Telegram Channel</h4>
        <p>Get daily match updates & direct feeds</p>
      </div>
      <a href="https://t.me/rafimhossen3" target="_blank" class="tg-link-btn">
        ✈ JOIN
      </a>
    </div>

    <!-- গ্লোবাল স্পোর্টস সুইচিং গ্রিড -->
    <nav class="sports-tabs">
      <button class="tab-btn active" id="btn-foot" onclick="switchSport('football')">
        <span class="icon">⚽</span> Football
      </button>
      <button class="tab-btn" id="btn-cric" onclick="switchSport('cricket')">
        <span class="icon">🏏</span> Cricket
      </button>
      <button class="tab-btn" id="btn-basket" onclick="switchSport('basketball')">
        <span class="icon">🏀</span> Basketball
      </button>
      <button class="tab-btn" id="btn-tennis" onclick="switchSport('tennis')">
        <span class="icon">🎾</span> Tennis
      </button>
    </nav>

    <!-- মেইন ইন্টারেক্টিভ স্কোর মনিটর -->
    <main class="hub-monitor">
      <div class="monitor-loader"></div>
      <iframe 
        id="scoreDisplayFrame" 
        src="https://www.sofascore.com/tournament/football/spain/laliga/8/standings/tables/embed" 
        scrolling="yes" 
        loading="lazy">
      </iframe>
    </main>

    <!-- বটম বার ও কুইক রিলোডার -->
    <footer class="controls-strip">
      <div class="refresh-pill" onclick="reloadFeed()">
        🔄 Refresh Feed
      </div>
      <a href="https://t.me/share/url?url=https://t.me/rafimhossen3&text=Watch%20Live%20Match%20Scores" target="_blank" class="share-btn">
        Share Hub ↗
      </a>
    </footer>

  </div>

  <script>
    // স্পোর্টস সুইচ মেকানিজম
    const frame = document.getElementById('scoreDisplayFrame');
    const buttons = {
      football: document.getElementById('btn-foot'),
      cricket: document.getElementById('btn-cric'),
      basketball: document.getElementById('btn-basket'),
      tennis: document.getElementById('btn-tennis')
    };

    const sportsFeeds = {
      football: "https://www.sofascore.com/tournament/football/spain/laliga/8/standings/tables/embed",
      cricket: "https://www.scorespro.com/free-cricket-scores/",
      basketball: "https://www.sofascore.com/tournament/basketball/usa/nba/384/standings/tables/embed",
      tennis: "https://www.scorespro.com/free-tennis-scores/"
    };

    function switchSport(sportKey) {
      // রিমুভ এক্টিভ ক্লাস
      Object.values(buttons).forEach(btn => btn.classList.remove('active'));
      
      // সেট নতুন লিঙ্ক ও অ্যাক্টিভ স্টেট
      buttons[sportKey].classList.add('active');
      frame.src = sportsFeeds[sportKey];
    }

    function reloadFeed() {
      const currentSrc = frame.src;
      frame.src = '';
      setTimeout(() => { frame.src = currentSrc; }, 200);
    }

    // লাইভ ঘড়ি
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toUTCString().split(' ')[4] + ' UTC';
    }
    setInterval(updateClock, 1000);
    updateClock();

    // বাস্তবসম্মত লাইভ কাউন্টার
    setInterval(() => {
      const counter = document.getElementById('counterDisplay');
      let val = parseInt(counter.innerText.replace(',', ''));
      let variance = Math.floor(Math.random() * 9) - 4; 
      counter.innerText = (val + variance).toLocaleString();
    }, 2500);
  </script>

</body>
  </html>
