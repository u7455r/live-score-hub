    const blobManifest = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
    const linkManifest = document.createElement('link');

    #announcementBar {

    @keyframes pulse {

    .channels-tray {

    .channel-source {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;

  </style>
</head>
<body>

  <script>

    let adTriggerCount = 0;
    function triggerAd() {
      adTriggerCount++;
      if (adTriggerCount % 2 === 0) {
        window.open(ADSTERRA_DIRECT_URL, '_blank');
      }
    }

    if ('serviceWorker' in navigator) {
      const swCode = `self.addEventListener('fetch', function(e) {});`;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            document.getElementById('pwaInstallBtn').style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else {
        alert("অ্যাপটি ডাউনলোড করতে ব্রাউজারের ওপরের ৩টি ডটে (⋮) চাপ দিয়ে 'Add to Home screen' বা 'Install app' এ ক্লিক করুন।");
      }
    }

    const streamSources = [
      // মুভি চ্যানেল
      { name: "Action Cinema 24/7 HD", source: "Rakuten FAST CDN • 1080p Movies", tag: "MOVIE", url: "https://rakuten-actionmovies-1-gb.samsung.wurl.tv/playlist.m3u8" },
      { name: "Sci-Fi & Thriller Hub", source: "CloudFront CDN • 1080p Movies", tag: "MOVIE", url: "https://d35j504z0x2vu2.cloudfront.net/v1/master/0bc8e8376bd8417a1b6761138aa41c26c7309312/dust-samsunguk/playlist.m3u8" },
      { name: "Bollywood Hits & Cinema", source: "Cloud CDN • 1080p Bolly", tag: "BOLLY", url: "https://d2q8p4pe5spbak.cloudfront.net/bpk-tv/BollyHits/default/index.m3u8" },
      { name: "Classic Cinema Gold", source: "Samsung TV CDN • 720p Cinema", tag: "CINEMA", url: "https://fls-classiccinema.samsung.wurl.tv/playlist.m3u8" },
      
      // স্পোর্টস চ্যানেল
      { name: "T Sports Live HD", source: "AynaOTT CDN • 1080p Live", tag: "LIVE", url: "https://tvsen5.aynaott.com/TnMn5kZz8aLm/tracks-v1a1/mono.ts.m3u8" },
      { name: "FIFA TV+ Official HD", source: "Cloud CDN • 1080p FHD", tag: "FHD", url: "https://a62dad94.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWV1X0ZJRkFQbHVzRW5nbGlzaF9ITFM/playlist.m3u8" },
      { name: "Cazé TV Live (Brazil)", source: "Amagi CDN • 1080p Live", tag: "FHD", url: "https://dfr80qzd35crc.cloudfront.net/UNOP/Amagi/Caze_TV_BR/1080p-vtt/index.m3u8" },
      { name: "Real Madrid TV HD", source: "Akamai CDN • 1080p HD", tag: "1080p", url: "https://rmtv.akamaized.net/hls/live/2043153/rmtv-es-web/Bitrate_3.m3u8" },
      { name: "Red Bull TV Live Sports", source: "Akamai CDN • Low Latency", tag: "AUTO", url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master_3360.m3u8" },
      { name: "beIN Sports Extra 1", source: "Amagi FAST • 1080p HD", tag: "HD", url: "https://bein-esp-xumo.amagi.tv/playlist1080P.m3u8" },
      { name: "beIN Sports Extra 2", source: "Amagi FAST • 720p HD", tag: "HD", url: "https://bein-esp-xumo.amagi.tv/playlistR720P.m3u8" },
      { name: "beIN Xtra en Español", source: "CloudFront • 1080p HD", tag: "HD", url: "https://d35j504z0x2vu2.cloudfront.net/v1/master/0bc8e8376bd8417a1b6761138aa41c26c7309312/bein-sports-xtra-en-espanol/playlist.m3u8" },
      { name: "Tennis Channel HD", source: "Samsung TV Plus • 720p", tag: "HD", url: "https://tennischannel-int-samsunguk.amagi.tv/playlist.m3u8" },
      { name: "SportsGrid Live 1080p", source: "Amagi Live • 1080p HD", tag: "1080p", url: "https://sportsgrid-tribal.amagi.tv/playlist1080p.m3u8" },
      { name: "Cricket Gold TV", source: "CloudFront • 720p HD", tag: "HD", url: "https://dlmjdu39jadcr0.cloudfront.net/v1/master/9d062541f2ff39b5c0f48b763ca611d25f62fc25/FLS-MuxIP-CricketGold/418.m3u8" },
      { name: "Toffee FIFA Live AQ", source: "Cloudflare CDN • Adaptive", tag: "AUTO", url: "https://cdn-tt.pages.dev/ch3.m3u8" },
      { name: "FUEL TV Action Sports", source: "Amagi Live • Action Sports", tag: "HD", url: "https://cdn-uw2-prod.tsv2.amagi.tv/linear/amg01074-fueltv-fueltvomuaen-sportstribal/playlist.m3u8" },
      { name: "FIGHT NETWORK Live", source: "Amagi Live • Combat TV", tag: "HD", url: "https://amg00966-amg00966c10-wplt0201.playout.now3.amagi.tv/playlist/amg00966-amg00966c10-amgplt0201/playlist.m3u8" },
      { name: "Mr Bean Live TV", source: "Rakuten TV • 24/7 Comedy", tag: "CARTOON", url: "https://amg00627-amg00627c40-rakuten-uk-5725.playouts.now.amagi.tv/playlist/amg00627-banijayfast-mrbeanpopupcc-rakutenuk/playlist.m3u8" },
      { name: "Baby Shark TV", source: "Wurl CDN • Kids Live", tag: "KIDS", url: "https://newidco-babysharktv-1-eu.rakuten.wurl.tv/playlist.m3u8" },
      { name: "Saudi Quran Live", source: "Mjunoon CDN • 24/7 Makkah", tag: "ISLAMIC", url: "https://vodzong.mjunoon.tv:8087/streamtest/SaudiQuran-142/playlist.m3u8" }
    ];

    let activeIndex = 0;
    const videoEl = document.getElementById('streamPlayer');
    const pillsBar = document.getElementById('pillsBar');
    const channelsList = document.getElementById('channelsList');
    let hlsInstance = null;

    function playStream(index) {
      activeIndex = index;
      const stream = streamSources[index];

      if (hlsInstance) {
        hlsInstance.destroy();
      }

      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60
        });
        hlsInstance.loadSource(stream.url);
        hlsInstance.attachMedia(videoEl);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          videoEl.play().catch(() => {});
        });
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = stream.url;
        videoEl.play().catch(() => {});
      }

      renderPills();
      renderChannelList();
    }

    function renderPills() {
      pillsBar.innerHTML = '';
      streamSources.slice(0, 8).forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.className = `server-pill ${idx === activeIndex ? 'active' : ''}`;
        btn.innerHTML = `<span class="tag-hd">${s.tag}</span> ${s.name.split(' ')[0]}`;
        btn.onclick = () => {
          triggerAd();
          playStream(idx);
        };
        pillsBar.appendChild(btn);
      });
    }

    function renderChannelList() {
      const q = document.getElementById('searchBox').value.toLowerCase();
      channelsList.innerHTML = '';

      streamSources.forEach((s, idx) => {
        if (!s.name.toLowerCase().includes(q) && !s.source.toLowerCase().includes(q) && !s.tag.toLowerCase().includes(q)) return;

        const card = document.createElement('div');
        card.className = `channel-card ${idx === activeIndex ? 'active' : ''}`;
        card.innerHTML = `
          <div>
            <div class="channel-title">${s.name}</div>
            <div class="channel-source">${s.source}</div>
          </div>
          <span class="tag-hd">${s.tag}</span>
        `;
        card.onclick = () => {
          triggerAd();
          playStream(idx);
        };
        channelsList.appendChild(card);
      });
    }

    function updateLiveCount() {
      const counter = document.getElementById('userCount');
      let current = parseInt(counter.innerText);
      let change = Math.floor(Math.random() * 7) - 3;
      let newCount = Math.max(110, current + change);
      counter.innerText = newCount;
    }
    setInterval(updateLiveCount, 4000);

    renderPills();
    renderChannelList();
    playStream(0);
  </script>
</body>
