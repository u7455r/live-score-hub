<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rafim Live | Sports Arena & Global Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.4);
      --cyan: #00f2fe;
      --cyan-glow: rgba(0, 242, 254, 0.2);
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 9, 14, 0.85);
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .brand span {
      color: var(--accent);
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    main {
      flex: 1;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      padding: 2rem;
    }

    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: grid;
    }

    /* Stream Section */
    #streamView {
      grid-template-columns: 1fr 380px;
      gap: 2rem;
    }

    .player-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .video-container {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      border: 1px solid var(--card-border);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
    }

    .now-playing {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1.25rem 1.5rem;
      border-radius: 14px;
    }

    .title-area h2 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .title-area p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
      word-break: break-all;
    }

    /* Channel List Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: calc(100vh - 150px);
      position: sticky;
      top: 100px;
    }

    .search-input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      overflow-y: auto;
      padding-right: 4px;
    }

    .channel-list::-webkit-scrollbar {
      width: 5px;
    }
    .channel-list::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }

    .channel-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .channel-card:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .channel-card.active {
      border-color: var(--accent);
      background: rgba(255, 0, 85, 0.08);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.15);
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .channel-name {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quality-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.45rem;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    /* Servers Grid */
    #serversView {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      width: 100%;
    }

    #serversView.active {
      display: grid;
    }

    .server-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      backdrop-filter: blur(8px);
      transition: transform 0.2s;
    }

    .server-card:hover {
      border-color: var(--cyan);
      box-shadow: 0 8px 24px var(--cyan-glow);
      transform: translateY(-3px);
    }

    .server-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .server-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .server-type {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: rgba(0, 242, 254, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(0, 242, 254, 0.3);
    }

    .server-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .server-btn {
      flex: 1;
      min-width: 90px;
      text-align: center;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--card-border);
      transition: all 0.2s ease;
    }

    .server-btn:hover {
      background: #fff;
      color: #000;
    }

    .server-btn.mirror {
      background: rgba(255, 0, 85, 0.1);
      border-color: rgba(255, 0, 85, 0.3);
      color: #ff4d82;
    }

    .server-btn.mirror:hover {
      background: var(--accent);
      color: #fff;
    }

    @media (max-width: 1024px) {
      #streamView {
        grid-template-columns: 1fr;
      }
      .sidebar {
        height: auto;
        position: static;
      }
      .channel-list {
        max-height: 400px;
      }
      main {
        padding: 1rem;
      }
      header {
        padding: 1rem;
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>

    const servers = [

      { name: "SportyHunter", type: "Live Server", main: "https://sportyhunter.com/", mirror: null },

      { name: "Sportsurge", type: "Aggregator", main: "https://v2.sportsurge.net/home5/", mirror: null },
      { name: "DaddyLiveHD", type: "Aggregator", main: "https://daddylive.org/", mirror: "https://daddylive.nl/" },

      { name: "FootStreams", type: "Aggregator", main: "https://www.footstreams.co/", mirror: "https://footstreams.link/" }

    const video = document.getElementById('videoPlayer');
    const channelGrid = document.getElementById('channelGrid');
    const serversView = document.getElementById('serversView');
    const streamView = document.getElementById('streamView');
    const currentChannel = document.getElementById('currentChannel');
    const streamInfo = document.getElementById('streamInfo');
    let hlsInstance = null;
    let selectedIndex = 0;

    function renderChannels(channelsToRender) {
      channelGrid.innerHTML = '';
      channelsToRender.forEach((channel) => {
        const originalIndex = streams.findIndex(s => s.url === channel.url);
        const card = document.createElement('div');
        card.className = `channel-card ${originalIndex === selectedIndex ? 'active' : ''}`;
        card.innerHTML = `
          <div class="channel-info">
            <span>📺</span>
            <div class="channel-name" title="${channel.name}">${channel.name}</div>
          </div>
          <div class="quality-tag">${channel.quality}</div>
        `;
        card.onclick = () => playChannel(channel, originalIndex);
        channelGrid.appendChild(card);
      });
    }

    function filterChannels() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = streams.filter(c => c.name.toLowerCase().includes(query));
      renderChannels(filtered);
    }

    function playChannel(channel, index) {
      selectedIndex = index;
      currentChannel.innerText = channel.name;
      streamInfo.innerText = `Source: ${channel.url}`;

      renderChannels(streams);

      if (hlsInstance) {
        hlsInstance.destroy();
      }

      if (Hls.isSupported() && channel.url.includes('.m3u8')) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(channel.url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else {
        video.src = channel.url;
        video.play().catch(() => {});
      }
    }

    function switchTab(tab, element) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      if (tab === 'stream') {
        streamView.classList.add('active');
        serversView.classList.remove('active');
      } else {
        streamView.classList.remove('active');
        serversView.classList.add('active');
      }
    }

    // Load Servers Hub
    servers.forEach(server => {
      const card = document.createElement('div');
      card.className = 'server-card';
      let actionButtons = `<a href="${server.main}" target="_blank" rel="noopener noreferrer" class="server-btn">Server Link</a>`;
      if (server.mirror) {
        actionButtons += `<a href="${server.mirror}" target="_blank" rel="noopener noreferrer" class="server-btn mirror">Mirror Link</a>`;
      }
      card.innerHTML = `
        <div class="server-header">
          <div class="server-title">${server.name}</div>
          <span class="server-type">${server.type}</span>
        </div>
        <div class="server-actions">${actionButtons}</div>
      `;
      serversView.appendChild(card);
    });

    renderChannels(streams);
    playChannel(streams[0], 0);
