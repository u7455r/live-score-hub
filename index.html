<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRO SPORTS LIVE HUB | Global Match Scores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #07090e;
      --card-bg: rgba(16, 20, 29, 0.95);
      --accent-neon: #00e5ff;
      --accent-red: #ff3366;
      --accent-tg: #0088cc;
      --border: rgba(255, 255, 255, 0.08);
      --font-display: 'Rajdhani', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 229, 255, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(255, 51, 102, 0.07) 0%, transparent 45%);
      color: #f1f5f9;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px 10px 40px;
    }

    .app-shell {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ১. টপ হেডার ও লাইভ ব্যাজ */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent-neon);
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 51, 102, 0.15);
      border: 1px solid rgba(255, 51, 102, 0.4);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-red);
      font-family: var(--font-display);
      letter-spacing: 0.5px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-red);
      border-radius: 50%;
      animation: neonPulse 1.2s infinite alternate;
    }

    @keyframes neonPulse {
      0% { opacity: 0.4; transform: scale(0.85); box-shadow: 0 0 0 rgba(255, 51, 102, 0); }
      100% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 10px var(--accent-red); }
    }

    /* ২. রিয়েল-টাইম মেট্রিক বার */
    .metric-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 16, 24, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 12px;
    }

    .active-users {
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .active-users strong {
      color: #10b981;
      font-family: var(--font-display);
      font-size: 15px;
    }

    .utc-clock {
      color: #64748b;
      font-size: 11px;
      font-family: monospace;
    }

    /* ৩. অফিশিয়াল টেলিগ্রাম প্রমো কার্ড */
    .tg-vip-card {
      background: linear-gradient(135deg, rgba(0, 136, 204, 0.22) 0%, rgba(18, 24, 38, 0.95) 100%);
      border: 1px solid rgba(0, 136, 204, 0.45);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.15);
    }

    .tg-text h4 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .tg-text p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .tg-link-btn {
      background: var(--accent-tg);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(0, 136, 204, 0.4);
      transition: transform 0.15s ease;
    }

    .tg-link-btn:active {
      transform: scale(0.96);
    }

    /* ৪. স্পোর্টস সিলেকশন কন্ট্রোলস */
    .sports-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #0d1117;
      border: 1px solid var(--border);
      padding: 6px;
      border-radius: 14px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      padding: 10px 4px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s ease;
      font-family: var(--font-body);
    }

    .tab-btn.active {
      background: #1b2434;
      color: var(--accent-neon);
      border: 1px solid rgba(0, 229, 255, 0.35);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
    }

    /* ৫. লাইভ স্কোর মনিটর স্ক্রিন */
    .hub-monitor {
      width: 100%;
      height: 580px;
      background: #0b0d13;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .hub-monitor iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* বটম কন্ট্রোল */
    .controls-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 14px;
    }

    .refresh-pill {
      background: #161b26;
      border: 1px solid var(--border);
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .refresh-pill:active {
      background: #202737;
      color: #fff;
    }

    .share-btn {
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="app-shell">

    <!-- হেডার -->
    <header class="top-header">
      <div class="brand-title">⚡ PRO SPORTS HUB</div>
      <div class="live-indicator">
        <div class="pulse-dot"></div> ACTIVE FEED
      </div>
    </header>

    <!-- এনালিটিক্স ও ঘড়ি -->
    <div class="metric-bar">
      <div class="active-users">
        <span>● Online:</span>
        <strong id="counterDisplay">1,495</strong>
      </div>
      <div class="utc-clock" id="liveClock">00:00:00 UTC</div>
    </div>

    <!-- টেলিগ্রাম কার্ড -->
    <div class="tg-vip-card">
      <div class="tg-text">
        <h4>Official Telegram Channel</h4>
        <p>Get instant match alerts & link updates</p>
      </div>
      <a href="https://t.me/rafimhossen3" target="_blank" class="tg-link-btn">
        ✈ JOIN
      </a>
    </div>

    <!-- স্পোর্টস বাটন বার -->
    <nav class="sports-tabs">
      <button class="tab-btn active" id="btn-foot" onclick="switchSport('football')">
        ⚽ Football
      </button>
      <button class="tab-btn" id="btn-cric" onclick="switchSport('cricket')">
        🏏 Cricket
      </button>
      <button class="tab-btn" id="btn-tennis" onclick="switchSport('tennis')">
        🎾 Tennis
      </button>
    </nav>

    <!-- লাইভ স্কোর মনিটর ফ্রেম -->
    <main class="hub-monitor">
      <iframe 
        id="scoreDisplayFrame" 
        src="https://www.scorespro.com/free-soccer-scores/" 
        loading="lazy">
      </iframe>
    </main>

    <!-- ফুটার -->
    <footer class="controls-strip">
      <div class="refresh-pill" onclick="reloadFeed()">
        🔄 Refresh Feed
      </div>
      <a href="https://t.me/share/url?url=https://u7455r.github.io/live-score-hub/&text=Watch%20Live%20Match%20Scores" target="_blank" class="share-btn">
        Share Hub ↗
      </a>
    </footer>

  </div>

  <script>
    const frame = document.getElementById('scoreDisplayFrame');
    const buttons = {
      football: document.getElementById('btn-foot'),
      cricket: document.getElementById('btn-cric'),
      tennis: document.getElementById('btn-tennis')
    };

    // শতভাগ কার্যকর ও আনব্লকড গ্লোবাল লাইভ ফিড
    const sportsFeeds = {
      football: "https://www.scorespro.com/free-soccer-scores/",
      cricket: "https://www.scorespro.com/free-cricket-scores/",
      tennis: "https://www.scorespro.com/free-tennis-scores/"
    };

    function switchSport(sportKey) {
      Object.values(buttons).forEach(btn => btn.classList.remove('active'));
      buttons[sportKey].classList.add('active');
      frame.src = sportsFeeds[sportKey];
    }

    function reloadFeed() {
      const current = frame.src;
      frame.src = '';
      setTimeout(() => { frame.src = current; }, 200);
    }

    // ঘড়ি
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toUTCString().split(' ')[4] + ' UTC';
    }
    setInterval(updateClock, 1000);
    updateClock();

    // বাস্তবসম্মত অনলাইন কাউন্টার
    setInterval(() => {
      const elem = document.getElementById('counterDisplay');
      let val = parseInt(elem.innerText.replace(',', ''));
      elem.innerText = (val + Math.floor(Math.random() * 7) - 3).toLocaleString();
    }, 2800);
  </script>

</body>
  </html>
